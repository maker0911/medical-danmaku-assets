<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLiveChat 通用文字弹幕预览</title>
<link rel="stylesheet" href="bilibili.css">
<style>
html,body { margin:0; width:100%; background:#e3edf4 !important; }
.demo { display:flex; gap:30px; padding:20px; align-items:flex-start; }
.column { width:900px; flex:none; }
.column.narrow { width:490px; }
.label { font:16px sans-serif; padding:5px; color:#53718b; }
#items { width:100%; }
</style>
</head>
<body>
<div class="demo">
<div class="column"><div class="label">宽 900px</div><div id="items">
<yt-live-chat-text-message-renderer author-type="" blc-guard-level="0"><div id="content"><yt-live-chat-author-chip><span id="author-name">小小云</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">今天也要开心呀！</span></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="member" blc-guard-level="3"><div id="content"><yt-live-chat-author-chip><span id="author-name">小舰长</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">收到啦，谢谢你！</span></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="member" blc-guard-level="2"><div id="content"><yt-live-chat-author-chip><span id="author-name">今天也要努力的小护士</span></yt-live-chat-author-chip><span id="message">提督的单行弹幕和表情 <img class="emoji" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23ffdb62'/%3E%3Ccircle%20cx='23'%20cy='26'%20r='3'%20fill='%235b7489'/%3E%3Ccircle%20cx='41'%20cy='26'%20r='3'%20fill='%235b7489'/%3E%3C/svg%3E" alt="[表情]"></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="member" blc-guard-level="1"><div id="content"><yt-live-chat-author-chip><span id="author-name">蓝莓</span></yt-live-chat-author-chip><span id="message">这是一条比较长的总督弹幕，用来看看消息底框变长以后，两端的输液袋和创可贴是否仍然保持原来的大小。换行之后，底框也会跟着变高，新的听诊器和心电线仍然贴着右边。</span></div></yt-live-chat-text-message-renderer>
</div></div>
<div class="column narrow"><div class="label">窄 490px</div><div id="items">
<yt-live-chat-text-message-renderer author-type="" blc-guard-level="0"><div id="content"><yt-live-chat-author-chip><span id="author-name">小小云</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">今天也要开心呀！</span></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="moderator"><div id="content"><yt-live-chat-author-chip><span id="author-name">很长很长的昵称要能跟着变长</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">这是一条长弹幕，窄窗口下会自动换行，底框应当跟着内容变高，装饰位置保持在两端。</span></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="member" blc-guard-level="3"><div id="content"><yt-live-chat-author-chip><span id="author-name">一个比较长的舰长昵称看适配效果</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">窄窗口的多行舰长弹幕和表情 <img class="emoji" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23ffdb62'/%3E%3C/svg%3E" alt="[表情]"> 继续换行以后检查昵称框和底图。</span></span></div></yt-live-chat-text-message-renderer>
<yt-live-chat-text-message-renderer author-type="member" blc-guard-level="1"><div id="content"><yt-live-chat-author-chip><span id="author-name">小fa朵总督预览</span></yt-live-chat-author-chip><span id="image-and-message"><span id="message">包装层结构下，花、徽章和底纹也应只在总督消息上出现。</span></span></div></yt-live-chat-text-message-renderer>
</div></div>
</div>
<button id="replay" type="button" style="position:fixed;right:20px;bottom:20px;z-index:20;padding:10px 16px;border:1px solid #9fc9e7;border-radius:14px;background:#fff;color:#527390;font:16px sans-serif;cursor:pointer">重播入场动画</button>
<script>
document.querySelector("#replay").addEventListener("click", () => {
  document.querySelectorAll("yt-live-chat-text-message-renderer").forEach((item) => {
    item.replaceWith(item.cloneNode(true));
  });
});
</script>
</body></html>
