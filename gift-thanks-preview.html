<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>礼物感谢预览</title>
  <link rel="stylesheet" href="gift-thanks.css">
  <style>
    body { margin: 0; padding: 28px 12px; background: #1e2a47; }
    .stage { max-width: 840px; margin: 0 auto 30px; padding: 8px 12px; }
    .stage.narrow { max-width: 430px; }
    .stage h2 { color: #c9dff2; font: 16px "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body>
  <section class="stage">
    <h2>单件礼物</h2>
    <medical-gift-renderer>
      <div class="medical-gift-top"><span class="medical-gift-plus left"></span><div class="medical-gift-avatar"><img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23b9dcf3'/%3E%3Ccircle cx='50' cy='40' r='22' fill='%23fff9ed'/%3E%3Cpath d='M18 99q5-34 32-34t32 34' fill='%23fff9ed'/%3E%3C/svg%3E"></div><span class="medical-gift-plus right"></span></div>
      <div class="medical-gift-name">奶酪cheese</div>
      <div class="medical-gift-plate"><div class="medical-gift-line"><span>赠送的</span><span class="medical-gift-gift-name">小花花</span><img class="medical-gift-icon" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='23' fill='%23fff5db'/%3E%3Ctext x='32' y='46' font-size='34' text-anchor='middle'%3E🌸%3C/text%3E%3C/svg%3E"><span class="medical-gift-count">×1</span></div></div>
    </medical-gift-renderer>
  </section>
  <section class="stage narrow">
    <h2>窄画布、长昵称和多件礼物</h2>
    <medical-gift-renderer>
      <div class="medical-gift-top"><span class="medical-gift-plus left"></span><div class="medical-gift-avatar"></div><span class="medical-gift-plus right"></span></div>
      <div class="medical-gift-name">一个很长很长的观众昵称</div>
      <div class="medical-gift-plate"><div class="medical-gift-line"><span>赠送的</span><span class="medical-gift-gift-name">浪漫的特别礼物</span><span class="medical-gift-count">×99</span></div></div>
    </medical-gift-renderer>
  </section>
</body>
</html>
