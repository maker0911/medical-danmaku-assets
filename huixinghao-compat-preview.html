<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>彗星号文字弹幕结构预览</title>
<link rel="stylesheet" href="bilibili.css">
<style>
html,body { margin:0; background:#e3edf4 !important; }
#items { width:min(470px, 100%); padding:12px 0; }
</style>
</head>
<body>
<div id="items">
  <yt-live-chat-text-message-renderer author-type="" privilegetype="0"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">普通用户</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">普通弹幕：没有新增等级装饰。</span></div></div></div></yt-live-chat-text-message-renderer>
  <yt-live-chat-text-message-renderer author-type="member" privilegetype="3"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">舰长</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">收到啦！</span></div></div></div></yt-live-chat-text-message-renderer>
  <yt-live-chat-text-message-renderer author-type="member" privilegetype="2"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">一位昵称比较长的提督</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">单行文字和表情 <img class="emoji" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Ccircle%20cx='32'%20cy='32'%20r='30'%20fill='%23ffdb62'/%3E%3C/svg%3E" alt="[表情]"></span></div></div></div></yt-live-chat-text-message-renderer>
  <yt-live-chat-text-message-renderer author-type="member" privilegetype="1"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">总督</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">这是一条多行文字弹幕，用来检查底框随文字增高时，听诊器和心电线仍贴在右侧，文字也保持完整换行。</span></div></div></div></yt-live-chat-text-message-renderer>
</div>
</body>
</html>
