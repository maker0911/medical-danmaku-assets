<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLiveChat · 奇迹款弹幕</title>
  <style>
/* 奇迹款文字弹幕：所有用户同一底框，左下与右上各一张装饰。 */
body,
yt-live-chat-renderer,
yt-live-chat-item-list-renderer,
#items { background: transparent !important; }

#items { container-type: inline-size; }

/* 平台测试画布的白色边条来自滚动条轨道；保留滚动，只隐藏轨道。 */
#items,
#item-scroller,
yt-live-chat-renderer,
yt-live-chat-item-list-renderer {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

#items::-webkit-scrollbar,
#item-scroller::-webkit-scrollbar,
yt-live-chat-renderer::-webkit-scrollbar,
yt-live-chat-item-list-renderer::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

/* 如果滚动发生在整个聊天页上，也只处理含聊天列表的页面。 */
html:has(#items),
body:has(#items) {
  scrollbar-width: none !important;
}

html:has(#items)::-webkit-scrollbar,
body:has(#items)::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

yt-live-chat-text-message-renderer,
yt-live-chat-text-message-renderer * { box-sizing: border-box !important; }

yt-live-chat-text-message-renderer {
  --miracle-avatar-frame-size: 78px;
  --miracle-avatar-frame-x: -36px;
  --miracle-avatar-frame-y: -18px;
  --miracle-avatar-size: 42px;
  --miracle-avatar-x: -18px;
  --miracle-avatar-y: 3px;
  display: block !important;
  position: relative !important;
  width: auto !important;
  margin: 25px 54px 47px !important;
  padding: 0 !important;
  overflow: visible !important;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif !important;
}

yt-live-chat-text-message-renderer #card {
  position: relative !important;
  display: block !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: visible !important;
  border: 0 !important;
  box-shadow: none !important;
  background: transparent !important;
}

/* 方形医疗头像牌；原图的奶白留白作底，头像放在内侧且不遮盖角饰。 */
yt-live-chat-text-message-renderer #card::before {
  content: "" !important;
  position: absolute !important;
  z-index: 3 !important;
  display: block !important;
  left: var(--miracle-avatar-frame-x) !important;
  top: var(--miracle-avatar-frame-y) !important;
  width: var(--miracle-avatar-frame-size) !important;
  height: var(--miracle-avatar-frame-size) !important;
  pointer-events: none !important;
  background: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/509f97dea30b6576a503fa95fd4e4cfc7e3f5078/assets/miracle/avatar_frame.png") center / contain no-repeat !important;
}

yt-live-chat-text-message-renderer #author-photo {
  position: absolute !important;
  z-index: 4 !important;
  display: block !important;
  left: var(--miracle-avatar-x) !important;
  top: var(--miracle-avatar-y) !important;
  width: var(--miracle-avatar-size) !important;
  height: var(--miracle-avatar-size) !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 2px !important;
  overflow: hidden !important;
  object-fit: cover !important;
  background: #dfedfa !important;
  box-shadow: none !important;
}

yt-live-chat-text-message-renderer #author-photo img {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 2px !important;
}

/* 原图 1308×79：圆角 40px，顶部 38px、底部 38px、中间 3px。
   九片各自定位，正文增高时只拉伸平直的中段。 */
yt-live-chat-text-message-renderer #content {
  --miracle-cap: 40px;
  --miracle-top: 38px;
  --miracle-bottom: 38px;
  --miracle-left-size: 64px;
  --miracle-left-height: 67px;
  --miracle-left-x: -8px;
  --miracle-left-y: -21px;
  --miracle-left-tilt: -2deg;
  --miracle-right-size: 64px;
  --miracle-right-height: 66px;
  --miracle-right-x: -11px;
  --miracle-right-y: -23px;
  --miracle-right-tilt: 16deg;
  position: relative !important;
  isolation: isolate;
  display: block !important;
  width: max-content !important;
  min-width: min(310px, 100%) !important;
  max-width: 100% !important;
  min-height: 92px !important;
  margin: 0 !important;
  padding: 18px 64px 18px 65px !important;
  overflow: visible !important;
  border: 0 !important;
  border-radius: 40px !important;
  box-shadow: none !important;
  background-color: #c8def2 !important;
  background-image:
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/top_left.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/top_center.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/top_right.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/middle_left.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/middle_center.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/middle_right.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/bottom_left.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/bottom_center.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/bottom_right.png") !important;
  background-size:
    var(--miracle-cap) var(--miracle-top),
    calc(100% - 2 * var(--miracle-cap)) var(--miracle-top),
    var(--miracle-cap) var(--miracle-top),
    var(--miracle-cap) calc(100% - var(--miracle-top) - var(--miracle-bottom)),
    calc(100% - 2 * var(--miracle-cap)) calc(100% - var(--miracle-top) - var(--miracle-bottom)),
    var(--miracle-cap) calc(100% - var(--miracle-top) - var(--miracle-bottom)),
    var(--miracle-cap) var(--miracle-bottom),
    calc(100% - 2 * var(--miracle-cap)) var(--miracle-bottom),
    var(--miracle-cap) var(--miracle-bottom) !important;
  background-position:
    left top, center top, right top,
    left center, center center, right center,
    left bottom, center bottom, right bottom !important;
  background-repeat: no-repeat !important;
}

/* 图二固定在底框左下角，图三固定在右上角；两者不占正文宽高。 */
yt-live-chat-text-message-renderer #content::before,
yt-live-chat-text-message-renderer #content::after {
  content: "" !important;
  position: absolute !important;
  z-index: 1 !important;
  display: block !important;
  width: var(--miracle-left-size) !important;
  height: var(--miracle-left-height) !important;
  pointer-events: none !important;
  background-repeat: no-repeat !important;
  background-size: contain !important;
  animation: none !important;
}

yt-live-chat-text-message-renderer #content::before {
  left: var(--miracle-left-x) !important;
  bottom: var(--miracle-left-y) !important;
  transform: rotate(var(--miracle-left-tilt)) !important;
  transform-origin: center !important;
  background-image: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/left_bottom.png") !important;
}

yt-live-chat-text-message-renderer #content::after {
  right: var(--miracle-right-x) !important;
  top: var(--miracle-right-y) !important;
  width: var(--miracle-right-size) !important;
  height: var(--miracle-right-height) !important;
  transform: rotate(var(--miracle-right-tilt)) !important;
  transform-origin: center !important;
  background-image: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4400f596a4e7ac0b414bf40860499d3c4ce036a4/assets/miracle/right_top.png") !important;
}

yt-live-chat-text-message-renderer #timestamp,
yt-live-chat-text-message-renderer #chat-badges { display: none !important; }

yt-live-chat-text-message-renderer yt-live-chat-author-chip {
  position: relative !important;
  z-index: 2 !important;
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  margin: 0 0 5px !important;
  padding: 0 !important;
  background: transparent !important;
}

yt-live-chat-text-message-renderer #author-name {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  color: #5c7eac !important;
  font-size: 16px !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  white-space: normal !important;
  overflow-wrap: anywhere !important;
  text-shadow: none !important;
  background: transparent !important;
}

yt-live-chat-text-message-renderer #image-and-message,
yt-live-chat-text-message-renderer #content > #message {
  position: relative !important;
  z-index: 2 !important;
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: visible !important;
  background: transparent !important;
}

yt-live-chat-text-message-renderer #message {
  display: block !important;
  color: #3e5c86 !important;
  font-size: 23px !important;
  font-weight: 700 !important;
  line-height: 1.35 !important;
  white-space: pre-wrap !important;
  overflow-wrap: anywhere !important;
  word-break: break-word !important;
  text-shadow: none !important;
}

yt-live-chat-text-message-renderer #message img.emoji {
  width: auto !important;
  height: 29px !important;
  max-width: 100% !important;
  vertical-align: -5px !important;
  object-fit: contain !important;
}

yt-live-chat-text-message-renderer #message img.blc-large-emoji {
  height: 44px !important;
  vertical-align: -8px !important;
}

@media (max-width: 480px) {
  yt-live-chat-text-message-renderer { margin: 18px 36px 42px !important; }
  yt-live-chat-text-message-renderer #content {
    --miracle-left-size: 52px;
    --miracle-left-height: 54px;
    --miracle-left-x: -7px;
    --miracle-left-y: -17px;
    --miracle-right-size: 52px;
    --miracle-right-height: 54px;
    --miracle-right-x: -9px;
    --miracle-right-y: -18px;
    padding: 17px 42px 18px 48px !important;
  }
  yt-live-chat-text-message-renderer #message { font-size: 19px !important; }
}

@container (max-width: 480px) {
  yt-live-chat-text-message-renderer { margin: 18px 36px 42px !important; }
  yt-live-chat-text-message-renderer #content {
    --miracle-left-size: 52px;
    --miracle-left-height: 54px;
    --miracle-left-x: -7px;
    --miracle-left-y: -17px;
    --miracle-right-size: 52px;
    --miracle-right-height: 54px;
    --miracle-right-x: -9px;
    --miracle-right-y: -18px;
    padding: 17px 42px 18px 48px !important;
  }
  yt-live-chat-text-message-renderer #message { font-size: 19px !important; }
}

/* 欢迎上舰：只匹配大航海购买通知，不影响文字弹幕、礼物或 SC。 */
yt-live-chat-membership-item-renderer {
  --welcome-backplates: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/backplates.png");
  --welcome-title: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/welcome_title.png");
  --welcome-title-captain: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/1398d3e863737e63bbbb0c0ce865be7267fb399e/assets/welcome_layers_13/captain_title.png");
  --welcome-title-admiral: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/5d1f58844d76184a60a8467913871b2af49266b0/assets/welcome_layers_13/admiral_title.png");
  --welcome-title-governor: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/5d1f58844d76184a60a8467913871b2af49266b0/assets/welcome_layers_13/governor_title.png");
  --welcome-iv-bag: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/iv_bag.png");
  --welcome-iv-tube: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/iv_tube.png");
  --welcome-stethoscope: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/stethoscope.png");
  --welcome-gauze: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/gauze.png");
  --welcome-bandage: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/bandage.png");
  --welcome-ecg: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/ecg_line.png");
  --welcome-cross-left: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/medical_cross_left.png");
  --welcome-cross-right: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/medical_cross_right.png");
  --welcome-accents-left: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/accents_left.png");
  --welcome-accents-right: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/accents_right.png");
  --welcome-accents-other: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/9b24aa0cb7100d499e7cdd2afece80652625a8dd/assets/welcome_layers_13/accents_other.png");
  display: block !important;
  width: 100% !important;
  margin: 16px 0 22px !important;
  overflow: visible !important;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif !important;
}

/* BLiveChat 的购买等级：3＝舰长，2＝提督，1＝总督；未标注时沿用原“欢迎上舰”。 */
yt-live-chat-membership-item-renderer[blc-guard-level="3"] {
  --welcome-title: var(--welcome-title-captain);
}

yt-live-chat-membership-item-renderer[blc-guard-level="2"] {
  --welcome-title: var(--welcome-title-admiral);
}

yt-live-chat-membership-item-renderer[blc-guard-level="1"] {
  --welcome-title: var(--welcome-title-governor);
}

/* 所有素材保留原始画布坐标；卡片宽度变化时，13 层按同一比例缩放。 */
yt-live-chat-membership-item-renderer #card {
  position: relative !important;
  isolation: isolate;
  display: block !important;
  box-sizing: border-box !important;
  width: 100% !important;
  max-width: none !important;
  margin: 0 auto !important;
  padding: 33.30078125% 0 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  overflow: visible !important;
  background-color: transparent !important;
  background-image:
    var(--welcome-accents-other),
    var(--welcome-accents-right),
    var(--welcome-accents-left),
    var(--welcome-ecg),
    var(--welcome-backplates) !important;
  background-position: center top !important;
  background-size: 100% auto !important;
  background-repeat: no-repeat !important;
  animation: medical-welcome-enter 700ms ease-out both !important;
}

yt-live-chat-membership-item-renderer #card::before,
yt-live-chat-membership-item-renderer #card::after,
yt-live-chat-membership-item-renderer #header::before,
yt-live-chat-membership-item-renderer #header::after,
yt-live-chat-membership-item-renderer #header-content::before,
yt-live-chat-membership-item-renderer #header-content::after {
  content: "";
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  box-sizing: border-box !important;
  display: block !important;
  width: 100% !important;
  height: 0 !important;
  padding-top: 33.30078125% !important;
  pointer-events: none !important;
  background-position: center top !important;
  background-size: 100% 100% !important;
  background-repeat: no-repeat !important;
}

yt-live-chat-membership-item-renderer #card::before {
  z-index: 1;
  background-image: var(--welcome-title) !important;
  animation: medical-welcome-title 850ms cubic-bezier(.18,.8,.2,1) 160ms both !important;
}

yt-live-chat-membership-item-renderer #card::after {
  z-index: 2;
  background-image: var(--welcome-iv-bag), var(--welcome-iv-tube) !important;
  transform-origin: 18.5% 17%;
  animation: medical-welcome-left 900ms ease-out 290ms both !important;
}

/* 伪元素仍以 #card 为定位父级；图案下方只保留独立的昵称牌。 */
yt-live-chat-membership-item-renderer #header {
  position: static !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-sizing: border-box !important;
  min-height: 0 !important;
  padding: 0 18px 16px !important;
  border: 0 !important;
  box-shadow: none !important;
  overflow: visible !important;
  background: transparent !important;
  color: #6587a6 !important;
}

yt-live-chat-membership-item-renderer #header::before {
  z-index: 2;
  background-image: var(--welcome-stethoscope), var(--welcome-gauze) !important;
  animation: medical-welcome-right 950ms ease-out 380ms both !important;
}

yt-live-chat-membership-item-renderer #header::after {
  z-index: 3;
  background-image: var(--welcome-bandage) !important;
  animation: medical-welcome-bandage 560ms ease-out 850ms both !important;
}

/* 两枚十字单独占据原画布坐标，分别从中心轻弹出来。 */
yt-live-chat-membership-item-renderer #header-content {
  position: static !important;
  display: flex !important;
  flex: 1 1 auto !important;
  justify-content: center !important;
  min-width: 0 !important;
  background: transparent !important;
}

yt-live-chat-membership-item-renderer #header-content::before {
  z-index: 3;
  background-image: var(--welcome-cross-left) !important;
  transform-origin: 10.1% 51.3%;

}

yt-live-chat-membership-item-renderer #header-content::after {
  z-index: 3;
  background-image: var(--welcome-cross-right) !important;

    medical-welcome-cross-pop 650ms cubic-bezier(.2,1.3,.35,1) 940ms both,

}

yt-live-chat-membership-item-renderer #header-content-primary-column,
yt-live-chat-membership-item-renderer #header-content-inner-column {
  position: relative !important;
  z-index: 4 !important;
  display: flex !important;
  justify-content: center !important;
  width: 100% !important;
  background: transparent !important;
}

yt-live-chat-membership-item-renderer #author-name {
  display: block !important;
  box-sizing: border-box !important;
  min-width: 180px !important;
  max-width: min(560px, calc(100vw - 48px)) !important;
  padding: 8px 24px !important;
  border: 2px solid #a8c8e7 !important;

  white-space: normal !important;
  overflow-wrap: anywhere !important;
}

yt-live-chat-membership-item-renderer #header-subtext {
  display: none !important;
}

/* 上舰通知只显示画面和昵称牌，隐藏平台自带的头像与勋章。 */
yt-live-chat-membership-item-renderer #author-photo,
yt-live-chat-membership-item-renderer #chat-badges,
yt-live-chat-membership-item-renderer #chip-badges,
yt-live-chat-membership-item-renderer yt-live-chat-author-badge-renderer {
  display: none !important;
}

yt-live-chat-membership-item-renderer #timestamp {
  display: none !important;
}

@keyframes medical-welcome-enter {
  from { opacity: 0; transform: translateY(14px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes medical-welcome-title {
  from { opacity: 0; transform: translateY(13px) scale(.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes medical-welcome-left {
  from { opacity: 0; transform: translate(-14px, -7px) rotate(-2deg); }
  to   { opacity: 1; transform: translate(0, 0) rotate(0); }
}

@keyframes medical-welcome-right {
  from { opacity: 0; transform: translate(15px, -12px); }
  to   { opacity: 1; transform: translate(0, 0); }
}

@keyframes medical-welcome-bandage {
  from { opacity: 0; transform: translate(13px, -10px) rotate(-4deg); }
  to   { opacity: 1; transform: translate(0, 0) rotate(0); }
}

@keyframes medical-welcome-cross-pop {
  0%   { opacity: 0; transform: scale(.65) rotate(-8deg); }
  70%  { opacity: 1; transform: scale(1.08) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes medical-welcome-cross-float-left {
  0%, 100% { transform: translateY(0) rotate(0) scale(1); }
  45%      { transform: translateY(-3px) rotate(-3deg) scale(1.04); }
}

@keyframes medical-welcome-cross-float-right {
  0%, 100% { transform: translateY(0) rotate(0) scale(1); }
  55%      { transform: translateY(-3px) rotate(3deg) scale(1.04); }
}

@media (prefers-reduced-motion: reduce) {

  yt-live-chat-membership-item-renderer #header::after,
  yt-live-chat-membership-item-renderer #header-content::before,

  }
}


/* 礼物感谢卡：头像、两侧医疗十字、昵称牌和三段式礼物框。 */
medical-gift-renderer {
  display: block;
  box-sizing: border-box;
  width: min(760px, 100%);
  margin: 24px auto 34px;
  padding: 0 12px 8px;
  color: #527b9f;
  font-family: "Arial Rounded MT Bold", "Microsoft YaHei", "PingFang SC", sans-serif;
  text-align: center;
  overflow: visible;
  animation: medical-gift-enter 720ms ease-out both;
}

medical-gift-renderer *,
medical-gift-renderer *::before,
medical-gift-renderer *::after { box-sizing: border-box; }

medical-gift-renderer .medical-gift-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 4vw, 30px);
  min-height: 152px;
}

medical-gift-renderer .medical-gift-avatar {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: clamp(106px, 18vw, 138px);
  height: clamp(106px, 18vw, 138px);
  padding: 9px;
  border: 4px solid #b6d6f0;
  border-radius: 50%;
  background: linear-gradient(140deg, #fffefa, #e2f3ff 58%, #86b8e4);
  box-shadow: 0 0 0 3px #f6fcff, 0 6px 0 #80add4,
    0 11px 22px #315c8144, inset 0 2px 5px #fff;
  animation: medical-gift-avatar-in 760ms cubic-bezier(.2,1.25,.35,1) 100ms both;
}

medical-gift-renderer .medical-gift-avatar::before {
  content: "✚";
  position: absolute;
  inset: 9px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e9f6ff;
  color: #9dc5e6;
  font-size: 42px;
}

medical-gift-renderer .medical-gift-avatar img {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  border: 2px solid #fff;
  border-radius: 50%;
  object-fit: cover;
  background: #e9f6ff;
}

medical-gift-renderer .medical-gift-plus {
  flex: none;
  display: block;
  width: 90px;
  height: 96px;
  background-repeat: no-repeat;
  background-size: 737px 246px;
  pointer-events: none;
  animation: medical-gift-plus-in 680ms cubic-bezier(.2,1.35,.35,1) 350ms both;
}

medical-gift-renderer .medical-gift-plus.left {
  background-image:
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/welcome_layers_13/medical_cross_left.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/welcome_layers_13/accents_left.png");
  background-position: -29px -72px, -29px -72px;
}

medical-gift-renderer .medical-gift-plus.right {
  background-image:
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/welcome_layers_13/medical_cross_right.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/welcome_layers_13/accents_right.png");
  background-position: -637px -83px, -637px -83px;
  animation-delay: 480ms;
}

medical-gift-renderer .medical-gift-name {
  display: block;
  width: max-content;
  min-width: 180px;
  max-width: min(560px, 100%);
  margin: 4px auto 17px;
  padding: 8px 24px;
  border: 2px solid #a8c8e7;
  border-radius: 999px;
  background: linear-gradient(180deg, #fffefa, #f4fbff 70%, #e3f1fd);
  box-shadow: 0 3px 0 #78a8d2, 0 7px 16px #385f8560, inset 0 2px 2px #fff;
  color: #4e7ba5;
  font-size: clamp(18px, 2.8vw, 28px);
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: .04em;
  text-shadow: 0 1px 0 #fff, 0 2px 2px #9cb9d2;
  overflow-wrap: anywhere;
  animation: medical-gift-name-in 900ms ease-out 300ms both;
}

medical-gift-renderer .medical-gift-plate {
  --gift-frame-height: clamp(75px, 19vw, 146px);
  --gift-frame-edge: calc(var(--gift-frame-height) * 1.142);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: var(--gift-frame-height);
  margin: auto;
  padding: 16px 42px 22px;
  animation: medical-gift-plate-in 650ms ease-out 580ms both;
}

medical-gift-renderer .medical-gift-plate::before {
  content: "";
  position: absolute;
  z-index: 0;
  inset: 0;
  background-image:
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/gift/frame_left.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/gift/frame_right.png"),
    url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/4d955e7c4074e9760ccde69dae47823eb11bbdce/assets/gift/frame_middle.png");
  background-position: left top, right top, center top;
  background-size:
    var(--gift-frame-edge) 100%,
    var(--gift-frame-edge) 100%,
    calc(100% - var(--gift-frame-edge) - var(--gift-frame-edge)) 100%;
  background-repeat: no-repeat;
  pointer-events: none;
}

medical-gift-renderer .medical-gift-line {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(5px, 1.2vw, 13px);
  width: 100%;
  min-width: 0;
  color: #527b9f;
  font-size: clamp(18px, 2.65vw, 28px);
  font-weight: 900;
  line-height: 1.2;
  text-shadow: 0 1px 0 #fff, 0 2px 2px #9cb9d2;
  white-space: nowrap;
}

medical-gift-renderer .medical-gift-gift-name {
  min-width: 0;
  max-width: 12em;
  overflow: hidden;
  text-overflow: ellipsis;
}

medical-gift-renderer .medical-gift-icon {
  flex: none;
  display: block;
  width: clamp(32px, 5vw, 56px);
  height: clamp(32px, 5vw, 56px);
  object-fit: contain;
}

medical-gift-renderer .medical-gift-count { flex: none; }

/* 醒目留言复用礼物卡，只让正文底板随文字增加高度。 */
medical-gift-renderer.medical-super-chat .medical-gift-plate {
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: auto;
  min-height: 146px;
  padding: 28px 50px 31px;
}

medical-gift-renderer.medical-super-chat .medical-gift-plate::before {
  background: none;
  border: 50px solid transparent;
  border-image-source: url("https://raw.githubusercontent.com/maker0911/medical-danmaku-assets/185f14805f7aaed57e699cab3336a190707ab6aa/assets/gift/amount_frame.png");
  border-image-slice: 135 450 135 450 fill;
  border-image-width: 50px 167px 50px 167px;
  border-image-repeat: stretch;
}

medical-gift-renderer .medical-sc-heading,
medical-gift-renderer .medical-sc-message {
  position: relative;
  z-index: 1;
  width: 100%;
  min-width: 0;
  color: #527b9f;
  font-weight: 900;
  text-shadow: 0 1px 0 #fff, 0 2px 2px #9cb9d2;
}

medical-gift-renderer .medical-sc-heading {
  font-size: clamp(17px, 2.4vw, 25px);
  line-height: 1.25;
}

medical-gift-renderer .medical-sc-message {
  font-size: clamp(17px, 2.5vw, 27px);
  line-height: 1.38;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

@keyframes medical-gift-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes medical-gift-avatar-in {
  from { opacity: 0; transform: scale(.77); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes medical-gift-plus-in {
  from { opacity: 0; transform: scale(.7) rotate(-8deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}
@keyframes medical-gift-name-in {
  from { opacity: 0; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes medical-gift-plate-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  medical-gift-renderer .medical-gift-top { min-height: 120px; gap: 4px; }
  medical-gift-renderer .medical-gift-plus {
    width: 72px;
    height: 77px;
    background-size: 590px 196px;
  }
  medical-gift-renderer .medical-gift-plus.left { background-position: -23px -58px, -23px -58px; }
  medical-gift-renderer .medical-gift-plus.right { background-position: -510px -66px, -510px -66px; }
  medical-gift-renderer .medical-gift-avatar { width: 104px; height: 104px; }
  medical-gift-renderer .medical-gift-plate { padding: 10px 31px 17px; }
  medical-gift-renderer .medical-gift-gift-name { max-width: 7em; }
  medical-gift-renderer.medical-super-chat .medical-gift-plate { padding: 23px 34px 26px; }
}

@media (prefers-reduced-motion: reduce) {
  medical-gift-renderer,
  medical-gift-renderer .medical-gift-avatar,
  medical-gift-renderer .medical-gift-plus,
  medical-gift-renderer .medical-gift-name,
  medical-gift-renderer .medical-gift-plate { animation: none; }
}
  </style>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { display: flex; align-items: center; justify-content: flex-end; flex-direction: column; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #items { width: min(960px, 100%); max-height: 100%; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
    #items::-webkit-scrollbar { display: none; }
    yt-live-chat-membership-item-renderer #card { width: 100% !important; }
    .medical-item-leave { animation: medical-item-leave 360ms ease-in both !important; }
    @keyframes medical-item-leave { to { opacity: 0; transform: translateY(-12px); } }
  </style>
</head>
<body>
  <main id="items" aria-live="polite"></main>
  <script>
    (() => {
      const items = document.getElementById('items');
      const guardLabels = { 1: '总督', 2: '提督', 3: '舰长' };
      const params = new URLSearchParams(location.search);
      let showingDemo = false;
      const messages = new Map();

      function text(value, fallback = '') {
        return value == null ? fallback : String(value);
      }

      function safeImageUrl(value) {
        try {
          const url = new URL(text(value));
          return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
        } catch { return ''; }
      }

      function createTextMessage(data) {
        if (!data || typeof data !== 'object' || (data.platform && data.platform !== 'bili')) return null;
        const messageText = text(data.message);
        const emojiUrl = Number(data.dmType) === 1 ? safeImageUrl(data.emojiImgUrl) : '';
        if (!messageText && !emojiUrl) return null;

        const item = document.createElement('yt-live-chat-text-message-renderer');
        const level = Number(data.guardLevel);
        const validLevel = level === 1 || level === 2 || level === 3 ? level : 0;
        item.setAttribute('blc-guard-level', String(validLevel));
        item.setAttribute('author-type', data.isAnchor ? 'owner' : data.isModerator ? 'moderator' : validLevel ? 'member' : '');

        const card = document.createElement('div');
        card.id = 'card';
        const content = document.createElement('div');
        content.id = 'content';
        const chip = document.createElement('yt-live-chat-author-chip');
        const name = document.createElement('span');
        name.id = 'author-name';
        name.textContent = text(data.uname, '观众').slice(0, 100);
        chip.append(name);

        const wrapper = document.createElement('div');
        wrapper.id = 'image-and-message';
        const message = document.createElement('span');
        message.id = 'message';
        if (emojiUrl) {
          const image = document.createElement('img');
          image.className = 'emoji blc-large-emoji';
          image.src = emojiUrl;
          image.alt = messageText || '[表情]';
          image.referrerPolicy = 'no-referrer';
          message.append(image);
        } else {
          message.textContent = messageText;
        }
        wrapper.append(message);
        content.append(chip, wrapper);
        const faceUrl = safeImageUrl(data.face);
        if (faceUrl) {
          const photo = document.createElement('img');
          photo.id = 'author-photo';
          photo.src = faceUrl;
          photo.alt = '';
          photo.referrerPolicy = 'no-referrer';
          card.append(photo);
        }
        card.append(content);
        item.append(card);
        return item;
      }

      function createGuardNotification(data) {
        if (!data || typeof data !== 'object' || (data.platform && data.platform !== 'bili')) return null;
        const level = Number(data.guardLevel);
        if (!guardLabels[level]) return null;

        const item = document.createElement('yt-live-chat-membership-item-renderer');
        item.setAttribute('show-only-header', '');
        item.setAttribute('blc-guard-level', String(level));
        const nameText = text(data.uname, '舰队成员').slice(0, 100);
        item.setAttribute('aria-label', `${nameText}${text(data.action, '开通').slice(0, 16)}${guardLabels[level]}`);

        const card = document.createElement('div');
        card.id = 'card';
        const header = document.createElement('div');
        header.id = 'header';
        const headerContent = document.createElement('div');
        headerContent.id = 'header-content';
        const primary = document.createElement('div');
        primary.id = 'header-content-primary-column';
        const inner = document.createElement('div');
        inner.id = 'header-content-inner-column';
        const name = document.createElement('span');
        name.id = 'author-name';
        name.textContent = nameText;
        inner.append(name);
        primary.append(inner);
        headerContent.append(primary);
        header.append(headerContent);
        card.append(header);
        item.append(card);
        return item;
      }

      function createThankYouCard(data) {
        const item = document.createElement('medical-gift-renderer');
        const top = document.createElement('div');
        top.className = 'medical-gift-top';
        const left = document.createElement('span');
        left.className = 'medical-gift-plus left';
        const right = document.createElement('span');
        right.className = 'medical-gift-plus right';
        const avatar = document.createElement('div');
        avatar.className = 'medical-gift-avatar';
        const faceUrl = safeImageUrl(data.face);
        if (faceUrl) {
          const image = document.createElement('img');
          image.src = faceUrl;
          image.alt = '';
          image.referrerPolicy = 'no-referrer';
          avatar.append(image);
        }
        top.append(left, avatar, right);

        const nickname = document.createElement('div');
        nickname.className = 'medical-gift-name';
        nickname.textContent = text(data.uname, '观众').slice(0, 100);
        const plate = document.createElement('div');
        plate.className = 'medical-gift-plate';
        item.append(top, nickname, plate);
        return { item, plate };
      }

      function createGiftNotification(data) {
        if (!data || typeof data !== 'object' || (data.platform && data.platform !== 'bili')) return null;
        const { item, plate } = createThankYouCard(data);
        const line = document.createElement('div');
        line.className = 'medical-gift-line';
        const prefix = document.createElement('span');
        prefix.textContent = '赠送的';
        const giftName = document.createElement('span');
        giftName.className = 'medical-gift-gift-name';
        giftName.textContent = text(data.giftName, '礼物').slice(0, 80);
        line.append(prefix, giftName);
        const iconUrl = safeImageUrl(data.giftIcon);
        if (iconUrl) {
          const icon = document.createElement('img');
          icon.className = 'medical-gift-icon';
          icon.src = iconUrl;
          icon.alt = '';
          icon.referrerPolicy = 'no-referrer';
          line.append(icon);
        }
        const count = document.createElement('span');
        count.className = 'medical-gift-count';
        const quantity = Math.max(1, Math.floor(Number(data.giftNum) || 1));
        count.textContent = `×${quantity}`;
        line.append(count);
        plate.append(line);
        return item;
      }

      function createSuperChatNotification(data) {
        if (!data || typeof data !== 'object' || (data.platform && data.platform !== 'bili')) return null;
        const messageText = text(data.message).slice(0, 2000);
        if (!messageText.trim()) return null;
        const { item, plate } = createThankYouCard(data);
        item.classList.add('medical-super-chat');
        const heading = document.createElement('div');
        heading.className = 'medical-sc-heading';
        heading.textContent = '赠送的醒目留言';
        const message = document.createElement('div');
        message.className = 'medical-sc-message';
        message.textContent = messageText;
        plate.append(heading, message);
        return item;
      }

      function appendItem(item, lifetime) {
        if (!item) return;
        items.append(item);
        while (items.children.length > 8) items.firstElementChild.remove();
        items.scrollTop = items.scrollHeight;
        if (lifetime) window.setTimeout(() => {
          if (!item.isConnected) return;
          item.classList.add('medical-item-leave');
          window.setTimeout(() => item.remove(), 380);
        }, lifetime);
      }


      function addMessage(msg) {
        if (!msg || typeof msg !== 'object') return;
        let item = null;
        if (msg.type === 0) {
          const hasImage = Array.isArray(msg.contentParts) &&
            msg.contentParts.some(part => part && part.type === 1);
          item = createTextMessage({
            platform: 'bili', uname: msg.authorName, face: msg.avatarUrl,
            message: msg.content || (hasImage ? '[表情]' : ''),
            guardLevel: msg.privilegeType,
            isAnchor: msg.authorType === 3,
            isModerator: msg.authorType === 2
          });
          if (item && Array.isArray(msg.contentParts) && msg.contentParts.length) {
            const message = item.querySelector('#message');
            message.replaceChildren();
            for (const part of msg.contentParts) {
              if (!part) continue;
              if (part.type === 1) {
                const url = safeImageUrl(part.url);
                if (url) {
                  const image = document.createElement('img');
                  image.className = 'emoji';
                  image.src = url;
                  image.alt = text(part.text, '[表情]');
                  image.referrerPolicy = 'no-referrer';
                  message.append(image);
                } else message.append(document.createTextNode(text(part.text)));
              } else if (part.type === 0) {
                message.append(document.createTextNode(text(part.text)));
              }
            }
          }
        } else if (msg.type === 1) {
          item = createGiftNotification({
            platform: 'bili', uname: msg.authorName, face: msg.avatarUrl,
            giftName: msg.giftName, giftIcon: msg.giftIconUrl, giftNum: msg.num
          });
        } else if (msg.type === 2) {
          item = createGuardNotification({
            platform: 'bili', uname: msg.authorName,
            guardLevel: msg.privilegeType, action: '开通'
          });
        } else if (msg.type === 3) {
          item = createSuperChatNotification({
            platform: 'bili', uname: msg.authorName, face: msg.avatarUrl,
            message: msg.content
          });
        }
        if (item && msg.id != null) item.dataset.messageId = String(msg.id);
        if (item && msg.id != null) messages.set(String(msg.id), { ...msg });
        if (messages.size > 128) messages.delete(messages.keys().next().value);
        if (item && showingDemo) { items.replaceChildren(); showingDemo = false; }
        appendItem(item, msg.type === 1 || msg.type === 2 || msg.type === 3 ? 8000 : 0);
      }

      window.addEventListener('message', event => {
        if (event.source !== window.parent || !event.data) return;
        const { type, data } = event.data;
        if (type === 'blcAddMsg') addMessage(data);
        if (type === 'blcUpdateMsg' && data && data.id != null) {
          const id = String(data.id);
          const previous = messages.get(id);
          if (previous && data.newValuesObj && typeof data.newValuesObj === 'object') {
            Object.assign(previous, data.newValuesObj);
            const item = Array.from(items.children).find(node => node.dataset.messageId === id);
            if (item && previous.type === 1) {
              const count = item.querySelector('.medical-gift-count');
              const giftName = item.querySelector('.medical-gift-gift-name');
              if (count) count.textContent = '×' + Math.max(1, Math.floor(Number(previous.num) || 1));
              if (giftName) giftName.textContent = text(previous.giftName, '礼物').slice(0, 80);
            }
            if (item && previous.type === 3) {
              const message = item.querySelector('.medical-sc-message');
              if (message) message.textContent = text(previous.content).slice(0, 2000);
            }
          }
        }
        if (type === 'blcDelMsgs' && data && Array.isArray(data.ids)) {
          const ids = new Set(data.ids.map(String));
          ids.forEach(id => messages.delete(id));
          items.querySelectorAll('[data-message-id]').forEach(node => {
            if (ids.has(node.dataset.messageId)) node.remove();
          });
        }
      });
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'blcTemplateConnect', data: null }, '*');
      }

      if (params.has('demo')) {
        showingDemo = true;
        addMessage({ type: 0, authorName: '普通观众', content: '今天也要开心呀！', privilegeType: 0 });
        addMessage({ type: 0, authorName: '提督', content: '提督消息示例', privilegeType: 2 });
        addMessage({ type: 2, authorName: '奶酪cheese', privilegeType: 3 });
        addMessage({ type: 1, authorName: '送礼物的小伙伴', giftName: '小花花', num: 1 });
        addMessage({ type: 3, authorName: '醒目留言的小伙伴', content: '今天也要好好休息呀！这是一条会自动换行的醒目留言，文字增多时奶白底板也会跟着变高。' });
      }
    })();
  </script>
</body>
</html>
