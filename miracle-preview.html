<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奇迹款弹幕预览</title>
  <link rel="stylesheet" href="miracle-preview-local.css">
  <style>
    body { margin: 0; padding: 24px 12px 50px; background: #25283e !important; }
    h1, h2 { color: #ecf3ff; font-family: "Microsoft YaHei", sans-serif; }
    h1 { font-size: 22px; text-align: center; }
    h2 { margin: 28px 0 10px; font-size: 15px; }
    .stage { width: min(760px, 100%); margin: auto; }
    .stage.narrow { width: min(390px, 100%); }
    .stage main { padding: 4px 0 20px; }
  </style>
</head>
<body>
  <h1>奇迹款文字弹幕</h1>
  <section class="stage">
    <h2>短消息与长昵称</h2>
    <main>
      <yt-live-chat-text-message-renderer author-type="" blc-guard-level="0"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">普通观众</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">今天好开心！</span></div></div></div></yt-live-chat-text-message-renderer>
      <yt-live-chat-text-message-renderer author-type="member" blc-guard-level="2"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">昵称很长很长的提督小伙伴</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">大家晚上好，今天也要记得好好休息。</span></div></div></div></yt-live-chat-text-message-renderer>
    </main>
  </section>
  <section class="stage narrow">
    <h2>窄画布、多行与表情</h2>
    <main id="items">
      <yt-live-chat-text-message-renderer author-type="member" blc-guard-level="1"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">总督</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">这是一条比较长的弹幕，换行后浅蓝色底框会向下增长，左下角和右上角的装饰保持原样。</span></div></div></div></yt-live-chat-text-message-renderer>
      <yt-live-chat-text-message-renderer author-type="moderator" blc-guard-level="0"><div id="card"><div id="content"><yt-live-chat-author-chip><span id="author-name">房管</span></yt-live-chat-author-chip><div id="image-and-message"><span id="message">发一个表情 <img class="emoji" alt="笑脸" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23ffe59f'/%3E%3Ctext x='20' y='28' font-size='24' text-anchor='middle'%3E%E2%98%BA%3C/text%3E%3C/svg%3E"> 再继续聊天。</span></div></div></div></yt-live-chat-text-message-renderer>
    </main>
  </section>
</body>
</html>
